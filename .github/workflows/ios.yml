name: Build iOS IPA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ تثبيت Flutter (متوافق مع Dart 3.7)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.3

      # 3️⃣ تنظيف المشروع
      - name: Clean project
        run: flutter clean

      # 4️⃣ إصلاح مشكلة flutter_lints تلقائيًا
      - name: Fix flutter_lints version
        run: |
          sed -i '' 's/flutter_lints: \^6.0.0/flutter_lints: ^3.0.1/g' pubspec.yaml || true

      # 5️⃣ حذف مشاكل iOS (Pods + SPM)
      - name: Reset iOS build cache
        run: |
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/Flutter.framework
          rm -rf ios/Flutter/Flutter.podspec
          rm -rf ios/Runner.xcworkspace
          rm -rf ios/Podfile.lock
          rm -rf ios/.swiftpm
          rm -rf ios/Package.resolved

      # 6️⃣ تثبيت البكجات
      - name: Install dependencies
        run: flutter pub get

      # 7️⃣ تثبيت CocoaPods
      - name: Install CocoaPods
        run: |
          cd ios
          pod deintegrate
          pod install --repo-update
          cd ..

      # 8️⃣ بناء التطبيق بدون توقيع
      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign

      # 9️⃣ رفع الناتج
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app