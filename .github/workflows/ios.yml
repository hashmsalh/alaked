name: Build iOS IPA

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1️⃣ تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ تثبيت Flutter (نسخة ثابتة أفضل من beta)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2

      # 3️⃣ تنظيف المشروع
      - name: Clean project
        run: flutter clean

      # 4️⃣ حذف مشاكل iOS (Pods + SPM)
      - name: Reset iOS build cache
        run: |
          rm -rf ios/Pods
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/Flutter.framework
          rm -rf ios/Flutter/Flutter.podspec
          rm -rf ios/Runner.xcworkspace
          rm -rf ios/Podfile.lock
          rm -rf ios/.swiftpm
          rm -rf ios/Package.resolved

      # 5️⃣ تثبيت البكجات (مهم قبل pod install)
      - name: Install dependencies
        run: flutter pub get

      # 6️⃣ إجبار CocoaPods (إصلاح مشاكل SPM)
      - name: Install CocoaPods
        run: |
          cd ios
          pod deintegrate
          pod install --repo-update
          cd ..

      # 7️⃣ بناء التطبيق (بدون توقيع)
      - name: Build iOS (no signing)
        run: flutter build ios --release --no-codesign

      # 8️⃣ رفع الناتج
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app